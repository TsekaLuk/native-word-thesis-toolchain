references:
  heading: "参考文献"
  stop_prefixes: ["附录", "Appendix"]

front_matter:
  center_exact_texts: ["2026年6月"]
  cover_table_markers: ["专业班级", "指导教师"]

native_sample_size_captions: true

math_tables:
  - caption: "表A.1 推荐评分各分量权重与计算约定"
    widths: [2100, 1450, 1300, 3900]
    center_columns: [0, 1, 2]
    nowrap_columns: [1, 2]
    rows:
      - ["分量", "符号", "权重", "计算方式"]
      - ["向量语义相似度", {math: [{sub: ["s", "vec"]}]}, "0.35", "召回阶段已计算的画像向量与机会向量余弦相似度"]
      - ["技能标签匹配度", {math: [{sub: ["s", "skill"]}]}, "0.20", "标签集合的 Jaccard 相似系数"]
      - ["时间适配度", {math: [{sub: ["s", "time"]}]}, "0.15", "可用时段与服务时段的重叠比例"]
      - ["距离适配度", {math: [{sub: ["s", "dist"]}]}, "0.15", [{math: ["exp(-λd)"]}, "，其中 d 为距离，衰减系数 ", {math: ["λ=0.05"]}]]
      - ["可靠度", {math: [{sub: ["s", "rel"]}]}, "0.15", "历史履约率得分"]

  - caption: "表A.2 推荐理由生成触发条件"
    widths: [3600, 5100]
    center_columns: [0, 1]
    nowrap_columns: [0]
    rows:
      - ["触发条件", "生成理由"]
      - [{math: [{sub: ["s", "vec"]}, " ≥ 0.80"]}, "与您的技能背景高度匹配"]
      - [{math: ["0.60 ≤ ", {sub: ["s", "vec"]}, " < 0.80"]}, "与您的技能背景较为匹配"]
      - [[{math: [{sub: ["s", "skill"]}, " ≥ 0.50"]}, " 且至少命中一个兴趣标签"], "与您的兴趣标签高度吻合"]
      - [{math: [{sub: ["s", "time"]}, " ≥ 1.0"]}, "服务时间与您的可用时段完全匹配"]
      - [{math: ["0.60 ≤ ", {sub: ["s", "time"]}, " < 1.0"]}, "服务时间与您的可用时段大部分重叠"]
      - [{math: ["d ≤ 5 km"]}, "距您当前位置约 d 公里"]
      - [{math: ["5 < d ≤ 15 km"]}, "距您当前位置较近，交通便利"]
